services:
  postgres:
    image: postgres:16
    container_name: runmate-postgres
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: runmate
      POSTGRES_USER: runmate
      POSTGRES_PASSWORD: runmate
    volumes:
      - runmate-postgres-data:/var/lib/postgresql/data

  app:
    build: .
    container_name: runmate-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - postgres

volumes:
  runmate-postgres-data: