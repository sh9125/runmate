name: CI

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: runmate
          POSTGRES_USER: runmate
          POSTGRES_PASSWORD: runmate
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U runmate -d runmate"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 소스 코드 체크아웃
        uses: actions/checkout@v4

      - name: Java 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: 빌드 및 테스트
        run: ./gradlew test