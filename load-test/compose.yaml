name: runmate-load

services:
  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5435:5432"
    environment:
      POSTGRES_DB: runmate_load
      POSTGRES_USER: runmate_load
      POSTGRES_PASSWORD: runmate_load
      TZ: Asia/Seoul
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runmate_load -d runmate_load"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres-data:
